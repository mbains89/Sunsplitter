name: repo-guards

# SUN-CORRECT-01. New workflow. Do not fold into verify.yml or release-policy.yml.
on:
  pull_request:
    branches:
      - "version/**"
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repo-guards-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  repo-guards:
    name: repo-guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use exact Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          check-latest: false
      - name: Run repo guards
        env:
          GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/guards/run-all.mjs
      - name: Fail gutted files
        env:
          GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GUARD_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          node scripts/guards/file-shrink.mjs --self-test
          node scripts/guards/file-shrink.mjs
